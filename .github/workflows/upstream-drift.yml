name: Upstream drift

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.audit.outputs.drift }}
    steps:
      - name: Check out reference card
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out latest configured Omarchy ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy
          ref: quattro
          path: upstream-checkout
          persist-credentials: false

      - name: Compare canonical bindings with the lock
        id: audit
        shell: bash
        run: |
          set +e
          python3 -B scripts/audit_upstream.py \
            --upstream upstream-checkout \
            --json upstream-audit.json > upstream-audit.md
          status=$?
          set -e
          cat upstream-audit.md
          if [ "$status" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

  open-drift-issue:
    needs: audit
    if: needs.audit.outputs.drift == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open one deduplicated drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="Omarchy binding drift detected"
          existing="$(gh issue list --repo "$REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$REPOSITORY" \
              --title "$title" \
              --body "The scheduled canonical-binding audit differs from upstream/omarchy.lock. Review the audit log at $RUN_URL, reconcile the card, and update the lock only after review."
          fi
