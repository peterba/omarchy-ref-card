name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reference card
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Omarchy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy
          ref: ac2690cd7be4f47e4a255f5e2e78d904d436b068
          path: upstream-checkout
          persist-credentials: false

      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f # v4.0.5
        with:
          tectonic-version: 0.17.0

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Test upstream audit
        run: make check-upstream UPSTREAM_DIR=upstream-checkout

      - name: Build and verify Letter and A4 cards
        run: make check

      - name: Upload printable PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: printable-reference-cards
          path: |
            build/omarchy-reference-card-letter.pdf
            build/omarchy-reference-card-a4.pdf
          if-no-files-found: error
